<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4e1424">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Your Cart - Flavours Restaurant</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

    <!-- Header -->
    <header class="cart-header">
        <div class="cart-header-inner">
            <a href="#" id="back-to-menu" class="back-link" aria-label="Back to menu">
                <svg class="back-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
                <span>Menu</span>
            </a>
            <div class="header-brand">Flavours Restaurant</div>
        </div>
    </header>

    <!-- Invalid Table State -->
    <main id="invalid-table-state" class="state-message hidden">
        <p class="state-mark" aria-hidden="true">—</p>
        <h2>Table not recognized</h2>
        <p>Please scan the QR code provided at your table.</p>
        <a href="/" class="btn-primary" style="text-decoration: none; display: inline-block; text-align: center;">Go to Homepage</a>
    </main>

    <!-- Empty Cart State -->
    <main id="empty-cart-state" class="state-message hidden">
        <p class="state-mark" aria-hidden="true">＋</p>
        <h2>Your cart is empty</h2>
        <p>Explore our menu and add something delicious.</p>
        <a href="#" id="empty-view-menu-btn" class="btn-primary" style="text-decoration: none; display: inline-block; text-align: center; max-width: 250px;">VIEW MENU</a>
    </main>

    <!-- Cart Content -->
    <main id="cart-content" class="cart-main hidden">
        <h1 class="page-title">Your Order</h1>
        
        <div id="cart-items-container" class="cart-items-container">
            <!-- Cart items injected here -->
        </div>

        <div class="notes-section">
            <label for="order-notes" class="notes-label">Special Instructions (Optional)</label>
            <textarea 
                id="order-notes" 
                class="notes-input" 
                placeholder="e.g., Less spicy, no onions, extra sauce..." 
                maxlength="500"
                rows="3"
            ></textarea>
            <div class="char-count"><span id="char-count">0</span>/500</div>
        </div>
        
        <!-- Spacer for sticky footer -->
        <div class="footer-spacer"></div>
    </main>

    <!-- Sticky Checkout Footer -->
    <footer id="checkout-footer" class="checkout-footer hidden">
        <div class="checkout-summary">
            <div class="summary-row">
                <span>Subtotal (<span id="footer-item-count">0</span> items)</span>
                <span id="footer-subtotal">₹0</span>
            </div>
            <div class="summary-row total-row">
                <span>TOTAL</span>
                <span id="footer-total">₹0</span>
            </div>
        </div>
        <button id="place-order-btn" class="btn-primary btn-place-order">
            PLACE ORDER
        </button>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
